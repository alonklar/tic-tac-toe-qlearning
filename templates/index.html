<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alon's Tic Tac Toe Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="page">
    <h1>Alon's Tic Tac Toe Page</h1>

    <div id="main">
      <div id="controls">
        <button id="new-game">New game</button>
        <select id="agent-type">
          <!-- Both use the random agent for now.
               Later: set the value to your agent's id in AGENTS (TTT.py) -->
          <option value="random">Random</option>
          <option value="qtable">Q-table</option>
        </select>
        <button id="change-color">Change color</button>
      </div>

      <div id="game">
        <div id="status" class="info">Press New Game to start</div>
        <div id="board-wrap">
          <svg id="board" viewBox="0 0 300 300" width="240" height="240">
            <g id="cells"></g>
            <g id="grid-lines" stroke="#000000" stroke-width="10" stroke-linecap="round">
              <line x1="100" y1="10" x2="100" y2="290"/>
              <line x1="200" y1="10" x2="200" y2="290"/>
              <line x1="10" y1="100" x2="290" y2="100"/>
              <line x1="10" y1="200" x2="290" y2="200"/>
            </g>
            <g id="marks"></g>
            <line id="win-line" stroke="#333333" stroke-width="8" stroke-linecap="round" style="display:none"/>
          </svg>
          <div id="result-box" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <div id="error-overlay" hidden>
    <div id="error-box">
      <button id="error-close">Close</button>
      <div class="error-title">Error</div>
      <div id="error-message"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
